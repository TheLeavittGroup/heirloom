<style>

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);

  h1 { font-family:Georgia,'Times New Roman',serif; margin:0; font-size:30px; color:var(--navy-deep); }
  .role { color:var(--muted); font-weight:700; margin-top:4px; font-size:14px; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
  a.btn { display:block; text-decoration:none; font-weight:800; font-size:15px; border-radius:12px; padding:14px 10px;

  a.btn:hover { background:var(--navy); color:#fff; }
  a.primary { grid-column:span 2; background:linear-gradient(135deg,#e3b93a,var(--gold)); border:none;
    color:#3a2f05; font-size:17px; }
  a.primary:hover { filter:brightness(1.04); background:linear-gradient(135deg,#e3b93a,var(--gold)); }
  .proof { margin-top:16px; }
  a.prooflink { display:block; text-decoration:none; color:var(--ink); font-weight:800; font-size:14px;
    border:1px solid #e3ddd0; border-left:5px solid var(--gold); border-radius:12px; padding:13px 14px;
    text-align:left; background:#fdfaf2; }
  a.prooflink small { display:block; color:var(--muted); font-weight:600; margin-top:3px; }
  .share { margin-top:14px; text-align:center; }
  a.sharebtn { display:block; background:var(--navy); color:#fff; border:none; font-size:16px; }
  a.sharebtn:hover { background:var(--blue); color:#fff; }
  .sharenote { color:var(--muted); font-size:12px; font-weight:600; margin-top:8px; line-height:1.45; }
  footer { margin-top:20px; text-align:center; color:var(--muted); font-size:12px; font-weight:600; }
